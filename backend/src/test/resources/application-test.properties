# Test Application Configuration
spring.application.name=eldermoodai-backend-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Configuration for Testing
spring.flyway.enabled=false

# Redis Configuration for Testing (Embedded)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-testing-purposes-must-be-at-least-256-bits-long-for-hmac-sha256
jwt.expiration=3600000

# Encryption Configuration for Testing
# This is a valid 32-byte (256-bit) key encoded in base64: "test-key-32bytestest-key-32bytes"
encryption.key=dGVzdC1rZXktMzJieXRlc3Rlc3Qta2V5LTMyYnl0ZXM=

# Logging Configuration for Testing
logging.level.root=WARN
logging.level.top.publicnote.eldermoodai=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
