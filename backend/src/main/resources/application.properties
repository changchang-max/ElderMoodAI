# Application Name
spring.application.name=eldermoodai-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/eldermoodai?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=1234QwQ!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# ddl-auto=validate is intentionally not used with Spring Boot 4.x + Flyway.
# In Spring Boot 4.x (Spring Framework 7), the EntityManagerFactory initialization
# no longer implicitly depends on FlywayMigrationInitializer, causing Hibernate schema
# validation to run before Flyway has created the tables.
# Flyway is responsible for schema management; Hibernate should not interfere.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Naming strategy: snake_case for database columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway Configuration
# Flyway manages all schema changes. validateOnMigrate=true (default) ensures
# applied migrations match local scripts, catching accidental script modifications.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.validate-on-migrate=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# JWT Configuration (7 days = 604800000ms)
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment-must-be-at-least-256-bits}
jwt.expiration=604800000

# Encryption Configuration (AES-256)
# Default key is base64-encoded 256-bit key - MUST be changed in production
# This is a 32-byte key encoded in base64
encryption.key=${ENCRYPTION_KEY:RWxkZXJNb29kQUktS2V5LTMyQnl0ZXNFeGFjdGx5ISE=}

# AI Service Configuration
ai.service.provider=baidu
ai.service.timeout=30000

# Alert Configuration
alert.threshold.negative-emotion=0.7
alert.threshold.critical-emotion=0.95

# Notification Configuration
notification.email.enabled=false
notification.sms.enabled=false

# Data Retention Configuration
data.retention.days=365

# File Upload Configuration
# Maximum file sizes: 10MB for images, 50MB for videos, 5MB for audio
# Note: Per-type validation is handled in application code
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept
cors.allow-credentials=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Resilience4j Circuit Breaker Configuration (for AI Service)
# Triggers after 3 consecutive failures, waits 30 seconds before half-open
resilience4j.circuitbreaker.instances.aiService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=3
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.aiService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry Configuration (for AI Service)
# Exponential backoff: 3 retries, initial 1s, multiplier 2 (1s, 2s, 4s)
resilience4j.retry.instances.aiService.max-attempts=3
resilience4j.retry.instances.aiService.wait-duration=1s
resilience4j.retry.instances.aiService.enable-exponential-backoff=true
resilience4j.retry.instances.aiService.exponential-backoff-multiplier=2

# Logging Configuration
logging.level.root=INFO
logging.level.top.publicnote.eldermoodai=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson Configuration
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# Note: write-dates-as-timestamps is not supported in Jackson 3.x (Spring Boot 4.x)
# Date serialization is handled by the date-format property above

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
