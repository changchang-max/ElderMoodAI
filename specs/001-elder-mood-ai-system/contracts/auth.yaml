openapi: "3.0.3"
info:
  title: ElderMoodAI - 认证接口
  version: "1.0.0"

paths:
  /api/auth/login/phone:
    post:
      summary: 手机号+验证码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "13800138000" }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { description: 验证码错误或已过期 }
        "403": { description: 账号已禁用 }

  /api/auth/login/email:
    post:
      summary: 邮箱+密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { description: 邮箱或密码错误 }
        "403": { description: 账号已禁用 }

  /api/auth/send-code:
    post:
      summary: 发送手机验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200": { description: 验证码已发送 }
        "429": { description: 发送频率超限 }

  /api/auth/refresh:
    post:
      summary: 刷新 Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "401": { description: Refresh Token 无效或已过期 }

  /api/auth/logout:
    post:
      summary: 退出登录
      security:
        - bearerAuth: []
      responses:
        "200": { description: 退出成功 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            role: { type: string, enum: [admin, caregiver, family] }
            avatar: { type: string, nullable: true }
